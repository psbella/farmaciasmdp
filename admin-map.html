<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Administrador de farmacias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #ecf6f2;
      --surface: #f8fcfa;
      --text: #1f2328;
      --border: rgba(15,61,43,0.12);
      --accent: #1a7f37;
      --accent-hover: #15672e;
      --accent-dim: rgba(26,127,55,0.12);
      --muted: #57606a;
      --danger: #b42318;
      --danger-dim: rgba(180,35,24,0.10);
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 {
      font-family: 'Bebas Neue', 'Nunito', sans-serif;
      letter-spacing: 0.02em;
      margin-bottom: 20px;
      color: var(--text);
      font-size: 1.9rem;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); padding: 20px; }
    .campo { margin-bottom: 15px; }
    .campo label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .campo input, .campo textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: 8px; font-size: 14px; font-family: inherit;
    }
    .campo input:focus, .campo textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .coordenadas { background: var(--bg); padding: 12px; border-radius: 12px; margin: 15px 0; display: flex; gap: 10px; }
    .coordenadas input { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 8px; font-size: 12px; }
    .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    button {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: white; border: none; padding: 10px 18px;
      border-radius: 40px; cursor: pointer; font-weight: 700; font-size: 14px;
      font-family: 'Nunito', sans-serif; transition: all 0.15s;
    }
    button svg { flex-shrink: 0; }
    button:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-secundario { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-secundario:hover { background: var(--accent-dim); }
    .btn-descargar { background: #0969da; }
    .btn-descargar:hover { background: #0757b8; }
    .btn-gmaps { background: #b42318; }
    .btn-gmaps:hover { background: #8f1c13; }
    .estado {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg); padding: 10px 14px; border-radius: 8px; margin-top: 15px; font-size: 13px; border: 1px solid var(--border);
    }
    .estado.exito { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-dim); }
    .estado.error { color: var(--danger); border-color: var(--danger-dim); background: var(--danger-dim); }
    #map { height: 500px; border-radius: 16px; border: 1px solid var(--border); }
    #gmaps-frame { border-radius: 16px; }
    .progress { background: var(--border); border-radius: 20px; height: 6px; width: 100%; margin: 20px 0; }
    .progress-bar { background: var(--accent); border-radius: 20px; height: 6px; width: 0%; transition: width 0.3s; }
    .badge { background: var(--accent-dim); color: var(--accent); padding: 2px 10px; border-radius: 20px; font-size: 11px; margin-left: 10px; font-weight: 700; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
    select.select-farmacia {
      flex: 1; min-width: 160px; max-width: 320px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px;
      font-family: inherit; cursor: pointer;
    }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    /* ==================== PORTADA DE ACCESO ==================== */
    #login-gate {
      position: fixed; inset: 0; background: var(--bg); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 36px 32px; max-width: 380px; width: 100%; text-align: center;
      box-shadow: 0 12px 32px rgba(15,61,43,0.10);
    }
    .login-mark { width: 56px; height: 56px; margin: 0 auto 18px; }
    .login-card h1 { font-size: 1.6rem; margin-bottom: 8px; }
    .login-card p { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
    .login-card code { background: var(--accent-dim); color: var(--accent); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
    #login-form { display: flex; flex-direction: column; gap: 12px; }
    #login-token {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 10px 14px; border-radius: 8px; font-size: 14px; font-family: inherit; text-align: center;
    }
    #login-form button { justify-content: center; width: 100%; }
    .login-error {
      display: none; margin-top: 12px; color: var(--danger); background: var(--danger-dim);
      padding: 8px 12px; border-radius: 8px; font-size: 12px;
    }
  </style>
</head>
<body>

<div id="login-gate">
  <div class="login-card">
    <svg class="login-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="20" fill="#0f3d2b"/>
      <rect x="16" y="8" width="8" height="24" rx="2" fill="#3fb950"/>
      <rect x="8" y="16" width="24" height="8" rx="2" fill="#3fb950"/>
      <path d="M20 3 A17 17 0 0 1 36 18" fill="none" stroke="#7ee2a8" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>Acceso administrador</h1>
    <p>Ingresá tu token de GitHub (classic, scope <code>repo</code>) para editar las farmacias.</p>
    <form id="login-form">
      <input type="password" id="login-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" required>
      <button type="submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Ingresar
      </button>
    </form>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app" class="container" style="display:none;">
  <h1>Editor de farmacias</h1>
  <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="grid">
    <div class="panel">
      <div class="header-row">
        <h2 id="farm-nombre" style="margin: 0; font-size: 1.05rem;">Cargando... <span class="badge" id="contador">0/0</span></h2>
        <select id="select-farmacia" class="select-farmacia"></select>
      </div>
      <div class="campo"><label>Nombre</label><input type="text" id="input-nombre"></div>
      <div class="campo"><label>Dirección</label><textarea id="input-direccion" rows="2"></textarea></div>
      <div class="campo"><label>Teléfono</label><input type="text" id="input-telefono"></div>
      <div class="coordenadas"><input type="text" id="input-lat" placeholder="Latitud"><input type="text" id="input-lng" placeholder="Longitud"></div>
      <div class="buttons">
        <button id="btn-correcta">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Guardar y siguiente
        </button>
        <button id="btn-anterior" class="btn-secundario">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Anterior
        </button>
        <button id="btn-gmaps" class="btn-gmaps">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Buscar dirección
        </button>
        <button id="btn-descargar" class="btn-descargar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><polyline points="7 9 12 4 17 9"/><line x1="12" y1="4" x2="12" y2="15"/></svg>
          Guardar en GitHub
        </button>
      </div>
      <div id="estado" class="estado"></div>
    </div>
    <div class="panel" style="padding:0; display: flex; flex-direction: column;">
      <div style="display: flex; gap: 4px; padding: 8px; background: var(--bg); border-bottom: 1px solid var(--border);">
        <button id="tab-leaflet" class="btn-secundario" style="flex:1; justify-content:center; background: var(--accent); color: white; border: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          Editar mapa
        </button>
        <button id="tab-gmaps" class="btn-secundario" style="flex:1; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Google Maps
        </button>
      </div>
      <div style="flex:1; position: relative;">
        <div id="map"></div>
        <iframe id="gmaps-frame" style="display:none; width:100%; height:100%; border:none;"></iframe>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const GH_OWNER = 'psbella';
  const GH_REPO = 'farmaciasmdp';
  const GH_PATH = 'db.json';
  let ghToken = sessionStorage.getItem('gh_token');

  const ICONS = {
    ok: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    error: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    info: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    loading: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>'
  };

  function setEstado(mensaje, tipo) {
    const estado = document.getElementById('estado');
    estado.className = 'estado' + (tipo === 'exito' ? ' exito' : tipo === 'error' ? ' error' : '');
    estado.innerHTML = (ICONS[tipo === 'exito' ? 'ok' : tipo === 'error' ? 'error' : tipo === 'cargando' ? 'loading' : 'info']) + `<span>${mensaje}</span>`;
  }

  // ==================== PORTADA DE ACCESO ====================
  function mostrarApp() {
    document.getElementById('login-gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    iniciarAdmin();
  }

  if (ghToken) {
    mostrarApp();
  } else {
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('login-token').value.trim();
      if (!val) return;
      ghToken = val;
      sessionStorage.setItem('gh_token', val);
      mostrarApp();
    });
  }

  function iniciarAdmin() {
  let todasFarmacias = [];
  let currentIndex = 0;
  let currentMarker = null;
  let map = null;

  const pharmacyIcon = L.divIcon({
    className: 'custom-pharmacy-icon',
    html: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#1a7f37" stroke="white" stroke-width="1.5"/><path d="M12 7L12 13M9 10L15 10" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>',
    iconSize: [34, 34],
    popupAnchor: [0, -17]
  });

  async function cargarFarmacias() {
    const res = await fetch('db.json');
    const ciclosData = await res.json();
    const unicas = new Map();
    for (const grupo in ciclosData) {
      for (const f of ciclosData[grupo]) {
        const key = `${f.nombre}|${f.direccion}`;
        if (!unicas.has(key)) {
          unicas.set(key, {
            nombre: f.nombre,
            direccion: f.direccion,
            telefono: f.telefono,
            lat: f.lat,
            lng: f.lng,
            keyOriginal: key
          });
        }
      }
    }
    todasFarmacias = Array.from(unicas.values());
    todasFarmacias.sort((a, b) => a.nombre.localeCompare(b.nombre));
    poblarSelect();
    actualizarProgreso();
    mostrarFarmacia(0);
    setEstado('Editá los campos o arrastrá el pin.', 'info');
  }

  function poblarSelect() {
    const select = document.getElementById('select-farmacia');
    select.innerHTML = todasFarmacias.map((f, i) =>
      `<option value="${i}">${i + 1}. ${f.nombre} — ${f.direccion}</option>`
    ).join('');
    select.addEventListener('change', (e) => irAFarmacia(parseInt(e.target.value, 10)));
  }

  function irAFarmacia(index) {
    actualizarFarmaciaDesdeCampos();
    currentIndex = index;
    mostrarFarmacia(index);
    actualizarProgreso();
  }

  function mostrarFarmacia(index) {
    const f = todasFarmacias[index];
    if (!f) return;
    document.getElementById('input-nombre').value = f.nombre || '';
    document.getElementById('input-direccion').value = f.direccion || '';
    document.getElementById('input-telefono').value = f.telefono || '';
    document.getElementById('input-lat').value = f.lat != null ? f.lat.toFixed(6) : '';
    document.getElementById('input-lng').value = f.lng != null ? f.lng.toFixed(6) : '';
    document.getElementById('farm-nombre').innerHTML = `${f.nombre || '?'} <span class="badge">${index + 1}/${todasFarmacias.length}</span>`;
    document.getElementById('select-farmacia').value = index;
    actualizarMapa(f);
    actualizarGoogleMaps();
  }

  function actualizarMapa(f) {
    if (!map) {
      map = L.map('map').setView([-38.0055, -57.5426], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
    }
    if (currentMarker) map.removeLayer(currentMarker);
    if (window.markerGoogle) map.removeLayer(window.markerGoogle);

    const lat = parseFloat(document.getElementById('input-lat').value);
    const lng = parseFloat(document.getElementById('input-lng').value);
    const pos = (!isNaN(lat) && !isNaN(lng)) ? [lat, lng] : [-38.0055, -57.5426];

    currentMarker = L.marker(pos, { draggable: true, icon: pharmacyIcon }).addTo(map);
    currentMarker.bindPopup(`<b>${f.nombre}</b><br>${f.direccion}<br><small>Arrastrá para corregir</small>`).openPopup();
    currentMarker.on('dragend', () => {
      const newPos = currentMarker.getLatLng();
      document.getElementById('input-lat').value = newPos.lat.toFixed(6);
      document.getElementById('input-lng').value = newPos.lng.toFixed(6);
      actualizarFarmaciaDesdeCampos();
    });

    map.setView(pos, 16);
  }

  function actualizarGoogleMaps() {
    const f = todasFarmacias[currentIndex];
    if (f && f.direccion && document.getElementById('gmaps-frame').style.display !== 'none') {
      const query = encodeURIComponent(f.direccion + ', Mar del Plata, Argentina');
      document.getElementById('gmaps-frame').src = `https://www.google.com/maps?q=${query}&output=embed&z=16`;
    }
  }

  async function buscarDireccionEnGoogle() {
    const targetIndex = currentIndex;
    const f = todasFarmacias[targetIndex];
    if (!f || !f.direccion) return;

    const queries = [
      f.direccion + ', Mar del Plata, Argentina',
      f.direccion.replace(/AV\.? ?/i, 'Avenida ') + ', Mar del Plata, Argentina',
      f.direccion + ', Mar del Plata',
      f.direccion
    ];

    let data = null;

    for (const query of queries) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&countrycodes=ar`;
      try {
        const response = await fetch(url);
        data = await response.json();
        if (data.length > 0) break;
      } catch (e) { continue; }
    }

    if (data && data.length > 0) {
      const googleLat = parseFloat(data[0].lat);
      const googleLng = parseFloat(data[0].lon);

      const iconoGoogle = L.divIcon({
        className: 'custom-google-icon',
        html: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#4285F4" stroke="white" stroke-width="1.5"/><circle cx="12" cy="9" r="3" fill="white"/></svg>',
        iconSize: [34, 34],
        popupAnchor: [0, -17]
      });

      if (window.markerGoogle) map.removeLayer(window.markerGoogle);
      window.markerGoogle = L.marker([googleLat, googleLng], { icon: iconoGoogle }).addTo(map);
      window.markerGoogle.bindPopup(`<b>Resultado</b><br>${data[0].display_name}<br><small>¿Usar estas coordenadas?</small><br><button onclick="window.usarCoordenadasGoogle(${googleLat}, ${googleLng}, ${targetIndex})" style="margin-top:4px; padding:4px 8px; background:#4285F4; color:white; border:none; border-radius:4px; cursor:pointer;">Usar estas</button>`).openPopup();

      document.getElementById('tab-leaflet').click();
      map.setView([googleLat, googleLng], 16);
      setEstado('Resultado encontrado. Compará con el pin verde.', 'info');
    } else {
      setEstado('No se encontró la dirección. Probá manualmente.', 'error');
    }
  }

  function usarCoordenadasGoogle(lat, lng, targetIndex) {
    const f = todasFarmacias[targetIndex];
    if (!f) return;
    f.lat = lat;
    f.lng = lng;
    if (targetIndex === currentIndex) {
      document.getElementById('input-lat').value = lat.toFixed(6);
      document.getElementById('input-lng').value = lng.toFixed(6);
      actualizarMapa(f);
    }
    setEstado(`Coordenadas aplicadas a ${f.nombre}.`, 'exito');
  }
  window.usarCoordenadasGoogle = usarCoordenadasGoogle;

  function actualizarFarmaciaDesdeCampos() {
    const f = todasFarmacias[currentIndex];
    if (!f) return;
    f.nombre = document.getElementById('input-nombre').value.trim();
    f.direccion = document.getElementById('input-direccion').value.trim();
    f.telefono = document.getElementById('input-telefono').value.trim();
    const lat = parseFloat(document.getElementById('input-lat').value);
    const lng = parseFloat(document.getElementById('input-lng').value);
    if (!isNaN(lat)) f.lat = lat;
    if (!isNaN(lng)) f.lng = lng;
    setEstado('Cambio pendiente. Usá "Guardar en GitHub" para publicarlo.', 'info');
  }

  function siguiente() {
    actualizarFarmaciaDesdeCampos();
    if (currentIndex + 1 < todasFarmacias.length) {
      currentIndex++;
      mostrarFarmacia(currentIndex);
      actualizarProgreso();
    } else {
      setEstado('Recorriste todas las farmacias. Guardá los cambios en GitHub.', 'info');
    }
  }

  function anterior() {
    actualizarFarmaciaDesdeCampos();
    if (currentIndex - 1 >= 0) {
      currentIndex--;
      mostrarFarmacia(currentIndex);
      actualizarProgreso();
    }
  }

  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  async function guardarEnGitHub() {
    if (!ghToken) {
      sessionStorage.removeItem('gh_token');
      document.getElementById('login-gate').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
      return;
    }

    actualizarFarmaciaDesdeCampos();
    const res = await fetch('db.json');
    const dbOriginal = await res.json();
    const ciclosData = {};

    for (const grupo in dbOriginal) {
      ciclosData[grupo] = [];
      for (const farmacia of dbOriginal[grupo]) {
        const key = `${farmacia.nombre}|${farmacia.direccion}`;
        const encontrada = todasFarmacias.find(f => f.keyOriginal === key);
        if (encontrada) {
          ciclosData[grupo].push({
            nombre: encontrada.nombre,
            direccion: encontrada.direccion,
            telefono: encontrada.telefono,
            lat: encontrada.lat,
            lng: encontrada.lng
          });
        } else {
          ciclosData[grupo].push(farmacia);
        }
      }
    }

    let jsonStr = '{\n';
    const grupos = Object.keys(ciclosData);
    grupos.forEach((grupo, idxGrupo) => {
      jsonStr += `  "${grupo}": [\n`;
      ciclosData[grupo].forEach((f, i) => {
        const lat = f.lat != null ? f.lat : null;
        const lng = f.lng != null ? f.lng : null;
        jsonStr += `    {\n`;
        jsonStr += `      "nombre": "${f.nombre.replace(/"/g, '\\"')}",\n`;
        jsonStr += `      "direccion": "${f.direccion.replace(/"/g, '\\"')}",\n`;
        jsonStr += `      "telefono": "${f.telefono}",\n`;
        jsonStr += `      "lat": ${lat},\n`;
        jsonStr += `      "lng": ${lng}\n`;
        jsonStr += `    }`;
        if (i < ciclosData[grupo].length - 1) jsonStr += ',';
        jsonStr += '\n';
      });
      jsonStr += '  ]';
      if (idxGrupo < grupos.length - 1) jsonStr += ',';
      jsonStr += '\n';
    });
    jsonStr += '}';

    setEstado('Guardando en GitHub...', 'cargando');

    try {
      const apiBase = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
      const headers = {
        'Authorization': `token ${ghToken}`,
        'Accept': 'application/vnd.github+json'
      };

      const shaRes = await fetch(apiBase, { headers });
      if (shaRes.status === 401) {
        sessionStorage.removeItem('gh_token');
        throw new Error('Token invalido o sin permisos. Volvé a ingresarlo.');
      }
      if (!shaRes.ok) throw new Error(`No se pudo leer db.json (${shaRes.status}).`);
      const shaData = await shaRes.json();

      const putRes = await fetch(apiBase, {
        method: 'PUT',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: 'Actualizar db.json desde el editor de administracion',
          content: utf8ToBase64(jsonStr),
          sha: shaData.sha,
          branch: 'main'
        })
      });

      if (!putRes.ok) {
        const err = await putRes.json().catch(() => ({}));
        throw new Error(err.message || `Error al guardar (${putRes.status}).`);
      }

      setEstado('Guardado en GitHub. El deploy tarda un par de minutos.', 'exito');
    } catch (e) {
      setEstado(e.message, 'error');
    }
  }

  function actualizarProgreso() {
    const porcentaje = (currentIndex / todasFarmacias.length) * 100;
    document.getElementById('progress-bar').style.width = `${porcentaje}%`;
  }

  function bindEvents() {
    document.getElementById('btn-correcta').addEventListener('click', siguiente);
    document.getElementById('btn-anterior').addEventListener('click', anterior);
    document.getElementById('btn-descargar').addEventListener('click', guardarEnGitHub);
    document.getElementById('btn-gmaps').addEventListener('click', buscarDireccionEnGoogle);

    document.getElementById('tab-leaflet').addEventListener('click', () => {
      document.getElementById('map').style.display = 'block';
      document.getElementById('gmaps-frame').style.display = 'none';
      document.getElementById('tab-leaflet').style.background = 'var(--accent)';
      document.getElementById('tab-leaflet').style.color = 'white';
      document.getElementById('tab-gmaps').style.background = 'transparent';
      document.getElementById('tab-gmaps').style.color = 'var(--text)';
      if (map) map.invalidateSize();
    });

    document.getElementById('tab-gmaps').addEventListener('click', () => {
      const f = todasFarmacias[currentIndex];
      if (f && f.direccion) {
        const query = encodeURIComponent(f.direccion + ', Mar del Plata, Argentina');
        document.getElementById('gmaps-frame').src = `https://www.google.com/maps?q=${query}&output=embed&z=16`;
        document.getElementById('map').style.display = 'none';
        document.getElementById('gmaps-frame').style.display = 'block';
        document.getElementById('tab-leaflet').style.background = 'transparent';
        document.getElementById('tab-leaflet').style.color = 'var(--text)';
        document.getElementById('tab-gmaps').style.background = '#b42318';
        document.getElementById('tab-gmaps').style.color = 'white';
      }
    });

    const campos = ['input-nombre', 'input-direccion', 'input-telefono', 'input-lat', 'input-lng'];
    campos.forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        actualizarFarmaciaDesdeCampos();
        const lat = parseFloat(document.getElementById('input-lat').value);
        const lng = parseFloat(document.getElementById('input-lng').value);
        if (!isNaN(lat) && !isNaN(lng) && currentMarker) currentMarker.setLatLng([lat, lng]);
      });
    });
  }

  cargarFarmacias();
  bindEvents();
  } // fin iniciarAdmin
</script>
</body>
