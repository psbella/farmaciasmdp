name: Tests

on:
  push:
    branches: [main, modular]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node --version
      - run: npm test
